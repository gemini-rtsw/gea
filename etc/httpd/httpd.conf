#
# This file included in /etc/httpd/conf/gea.conf.
#

<VirtualHost *:80>
    DocumentRoot /gemsoft/opt/gea
    # ServerAdmin webmaster@gemini.edu		Not sure what to put here.
    # ServerName gea.gemini.edu			Not sure what to put here.
    ErrorLog  /gemsoft/var/log/gea/error_log
    CustomLog /gemsoft/var/log/gea/access_log common

    Timeout 300

    RewriteEngine On
    RewriteRule ^/$ /gemsoft/opt/gea/run/dispatch.py/pages/homePage 
    RewriteRule ^/pages/(.*).(pdf|txt|ps|gif|jpg|png)$ /pages/$1.$2 [S=1]
    RewriteRule ^/pages/(.*) /gemsoft/opt/gea/run/dispatch.py/pages/$1

    <Directory "/gemsoft/opt/gea">
        Options Indexes FollowSymLinks ExecCGI
        AddHandler cgi-script .py
        AddHandler cgi-script .cgi
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
